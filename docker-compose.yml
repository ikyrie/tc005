services:
  postgres:
    image: postgres:16-alpine
    container_name: soat_postgres
    environment:
      POSTGRES_USER: soat_user
      POSTGRES_PASSWORD: soat_password
      POSTGRES_DB: soat_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
