services:
  postgres:
    image: postgres:16-alpine
    container_name: soat_postgres
    environment:
      POSTGRES_USER: soat_user
      POSTGRES_PASSWORD: soat_password
      POSTGRES_DB: soat_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soat_user -d soat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: soat_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  platform-api:
    build:
      context: ./services/platform-api
      dockerfile: Dockerfile
    container_name: soat_platform_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://soat_user:soat_password@postgres:5432/soat_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      STORAGE_BASE_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/storage:/app/storage

  ai-processor:
    build:
      context: .
      dockerfile: services/ai-processor/Dockerfile
    container_name: soat_ai_processor
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      STORAGE_BASE_DIR: /app/storage
      PLATFORM_API_URL: http://platform-api:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      platform-api:
        condition: service_started
    volumes:
      - ./services/storage:/app/storage

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: soat_frontend
    ports:
      - "3000:80"
    depends_on:
      platform-api:
        condition: service_started

volumes:
  pgdata:
